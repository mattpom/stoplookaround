name: Bi-Weekly Content Publisher

on:
  schedule:
    - cron: '0 9 * * 4/14'
  workflow_dispatch:

jobs:
  publish-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and publish draft
        run: |
          if ! ls _drafts/*.html > /dev/null 2>&1; then
            echo "::warning::No drafts found in _drafts/ - add next article before scheduled run"
            exit 0
          fi
          DRAFT=$(ls _drafts/*.html | sort | head -1)
          DRAFT_NAME=$(basename "$DRAFT")
          cp "$DRAFT" "$DRAFT_NAME"
          rm "$DRAFT"
          TITLE=$(grep -oP '(?<=<title>)[^<]+' "$DRAFT_NAME" | sed "s/ — Stop.*//")
          TODAY=$(date +"%B %-d, %Y")
          TODAY_ISO=$(date +"%Y-%m-%d")
          echo "Publishing: $DRAFT_NAME | $TITLE | $TODAY"
          # Update travel-guides.html - inject new card at top of New This Month section
          if [ -f travel-guides.html ]; then
            NEW_CARD="          <a href=\"$DRAFT_NAME\" class=\"guide-card guide-card--featured\"><div class=\"guide-card__body\"><p class=\"guide-card__meta\">$TODAY<\/p><h2 class=\"guide-card__title\">$TITLE<\/h2><span class=\"guide-card__cta\">Read Guide &rarr;<\/span><\/div><\/a>"
            sed -i "s|NEW THIS MONTH|NEW THIS MONTH<\/p>\n$NEW_CARD\n<!--NEWTHISMONTH|" travel-guides.html
          fi
          # Update archive.html - inject into guide-list
          if [ -f archive.html ]; then
            ENTRY="          <a href=\"$DRAFT_NAME\" class=\"guide-row\"><div class=\"row-left\"><div class=\"row-cat\">Destination Guide<\/div><div class=\"row-title\">$TITLE<\/div><div class=\"row-date\">$TODAY<\/div><\/div><div class=\"row-arrow\">&rarr;<\/div><\/a>"
            sed -i "s|class=\"guide-list\"|class=\"guide-list\">\n$ENTRY\n<!--GUIDELIST|" archive.html
          fi
          # Update sitemap.xml - insert new URL before closing tag
          if [ -f sitemap.xml ]; then
            NEW_URL="  <url>\n    <loc>https:\/\/stoplookaround.com\/$DRAFT_NAME<\/loc>\n    <changefreq>monthly<\/changefreq>\n    <priority>0.9<\/priority>\n  <\/url>"
            sed -i "s|<\/urlset>|$NEW_URL\n<\/urlset>|" sitemap.xml
            # Fix index.html canonical URL if present
            sed -i "s|stoplookaround.com/index.html|stoplookaround.com/|g" sitemap.xml
          fi
          # Update or create feed.xml RSS feed
          FEED_ENTRY="    <item>\n      <title>$TITLE<\/title>\n      <link>https:\/\/stoplookaround.com\/$DRAFT_NAME<\/link>\n      <pubDate>$(date -R)<\/pubDate>\n      <guid>https:\/\/stoplookaround.com\/$DRAFT_NAME<\/guid>\n    <\/item>"
          if [ -f feed.xml ]; then
            sed -i "s|<\/channel>|$FEED_ENTRY\n  <\/channel>|" feed.xml
          else
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<rss version="2.0">' '  <channel>' '    <title>Stop. Look Around. — Travel Guides</title>' '    <link>https://stoplookaround.com</link>' '    <description>Travel guides for people who actually go places. No selfies. Just places.</description>' '    <language>en-us</language>' > feed.xml
            echo "$FEED_ENTRY" >> feed.xml
            printf '%s\n' '  </channel>' '</rss>' >> feed.xml
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bi-weekly publish: $DRAFT_NAME [$TODAY_ISO]"
          git push
