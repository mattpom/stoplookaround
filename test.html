<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Gallery</title>
  <style>
    body { margin: 0; background: #0f0f0f; color: #fff; font-family: Arial, sans-serif; }
    h2 { padding: 20px; margin: 0; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      padding: 20px;
    }
    .card {
      position: relative;
      background: #111;
      border-radius: 6px;
      overflow: hidden;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .overlay {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    }
    .place { font-weight: bold; font-size: 14px; }
    .caption { font-size: 12px; opacity: 0.8; }
  </style>
</head>
<body>

<h2>Test Gallery</h2>
<div id="gallery" class="gallery-grid"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  fetch("https://sheetdb.io/api/v1/f6isf0swrtqcl/search?Approved=yes")
    .then(res => res.json())
    .then(data => {
      const gallery = document.getElementById("gallery");
      if (!gallery) return;

      gallery.innerHTML = "";

      data.reverse().forEach(item => {
        const raw = item["Upload your photo"];
        if (!raw) return;

        let fileId = "";

        if (raw.includes("id=")) {
          fileId = raw.split("id=")[1].split("&")[0];
        } else if (raw.includes("/d/")) {
          fileId = raw.split("/d/")[1].split("/")[0];
        } else {
          return;
        }

        const imgUrl = `https://drive.google.com/thumbnail?id=${fileId}&sz=w1200`;

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <img src="${imgUrl}">
          <div class="overlay">
            <div class="place">${item["Where is this place?"]}</div>
            <div class="caption">${item["Tell us about this place"]}</div>
          </div>
        `;

        gallery.appendChild(card);
      });
    })
    .catch(err => console.error(err));
});
</script>

</body>
</html>
