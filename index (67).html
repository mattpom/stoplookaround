<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stop. Look. Around.</title>

<style>
body { margin:0; font-family: Arial, sans-serif; background:#0f0f0f; color:white; }

h1, h2 { margin:20px; }

.photo-wall {
  display:grid;
  grid-template-columns: repeat(5,1fr);
  grid-template-rows: 240px 180px;
  gap:4px;
  margin:20px;
}

.wall-photo {
  position:relative;
  overflow:hidden;
}

.wall-photo img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.wall-photo:nth-child(1){
  grid-column: span 2;
  grid-row: span 2;
}

.wall-photo:nth-child(4){
  grid-column: span 2;
}

/* PRINT CLEAN */
@media print {
  body { background:white !important; color:black !important; }
  .photo-wall { display:block; }
  .wall-photo img { max-height:250px; }
}
</style>
</head>

<body>

<h1>STOP. LOOK. AROUND.</h1>
<h2>PLACES PEOPLE ARE LOVING</h2>

<div class="photo-wall"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  fetch("https://sheetdb.io/api/v1/f6isf0swrtqcl/search?Approved=yes")
    .then(res => res.json())
    .then(data => {
      const gallery = document.querySelector(".photo-wall");
      if (!gallery) return;

      gallery.innerHTML = "";

      data.reverse().forEach(item => {
        const raw = item["Upload your photo"];
        if (!raw) return;

        let fileId = "";
        if (raw.includes("id=")) {
          fileId = raw.split("id=")[1].split("&")[0];
        } else if (raw.includes("/d/")) {
          fileId = raw.split("/d/")[1].split("/")[0];
        } else {
          return;
        }

        const imgUrl = `https://drive.google.com/thumbnail?id=${fileId}&sz=w1200`;

        const card = document.createElement("div");
        card.className = "wall-photo";

        card.innerHTML = `
          <img src="${imgUrl}">
        `;

        gallery.appendChild(card);
      });
    });
});
</script>

</body>
</html>
