<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.style.opacity = "1"; e.target.style.transform = "translateY(0)"; }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll(".rule-card, .wall-photo").forEach((el, i) => {
    el.style.opacity = "0"; el.style.transform = "translateY(24px)";
    el.style.transition = "opacity 0.5s " + (i * 0.08) + "s ease, transform 0.5s " + (i * 0.08) + "s ease";
    observer.observe(el);
  });

  const colors = ["gn-1","gn-2","gn-3","gn-4","gn-5","gn-6","gn-7","gn-8"];
  function addNote() {
    const text = document.getElementById("graffitiText").value.trim();
    const place = document.getElementById("graffitiPlace").value.trim();
    if (!text) return;
    const note = document.createElement("div");
    note.className = "graffiti-note " + colors[Math.floor(Math.random() * colors.length)];
    note.style.cssText = "opacity:0;transform:scale(0.8)";
    note.innerHTML = (place ? '<span class="note-place">X ' + place + "</span>" : "") + '"' + text + '"';
    document.getElementById("graffitiWall").prepend(note);
    setTimeout(function() {
      note.style.transition = "opacity 0.4s, transform 0.4s";
      note.style.opacity = "1";
      note.style.transform = "scale(1) rotate(" + (Math.random()*4-2).toFixed(1) + "deg)";
    }, 10);
    document.getElementById("graffitiText").value = "";
    document.getElementById("graffitiPlace").value = "";
  }
  document.getElementById("graffitiText").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); addNote(); }
  });

  const dropZone = document.querySelector(".drop-zone");
  if (dropZone) {
    dropZone.addEventListener("dragover", function(e) { e.preventDefault(); dropZone.style.borderColor = "var(--rust)"; });
    dropZone.addEventListener("dragleave", function() { dropZone.style.borderColor = ""; });
    dropZone.addEventListener("drop", function(e) {
      e.preventDefault(); dropZone.style.borderColor = "";
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith("image/")) {
        dropZone.querySelector("h3").textContent = "Got it!";
        dropZone.querySelector("p").textContent = file.name + " ready to submit.";
      }
    });
  }

  async function grabSheet(country, flag) {
    document.getElementById("modalCountry").textContent = flag + " " + country;
    document.getElementById("sheetBody").innerHTML = "<div class=\"sheet-loading\"><div><span class=\"sheet-loading-dot\"></span><span class=\"sheet-loading-dot\"></span><span class=\"sheet-loading-dot\"></span></div><p>Generating your " + country + " travel sheet...</p></div>";
    document.getElementById("printBtn").style.display = "none";
    document.getElementById("sheetModal").classList.add("active");
    document.body.style.overflow = "hidden";
    try {
      const response = await fetch("https://sla-travel-sheets.mattpom01.workers.dev", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ country: country })
      });
      const data = await response.json();
      let content = data.content || "Could not generate.";
      content = content.replace(/```html/gi, "").replace(/```/g, "").trim();
      const wrapper = document.createElement("div");
      wrapper.className = "sheet-content";
      const body = document.createElement("div");
      body.innerHTML = content;
      wrapper.appendChild(body);
      document.getElementById("sheetBody").innerHTML = "";
      document.getElementById("sheetBody").appendChild(wrapper);
      document.getElementById("printBtn").style.display = "inline-block";
    } catch(err) {
      document.getElementById("sheetBody").innerHTML = "<p style=\"color:var(--rust);padding:24px 0;\">Could not generate sheet right now. Try again.</p>";
    }
  }

  function closeSheet() {
    document.getElementById("sheetModal").classList.remove("active");
    document.body.style.overflow = "";
  }
  document.getElementById("sheetModal").addEventListener("click", function(e) { if (e.target === this) closeSheet(); });
  document.addEventListener("keydown", function(e) { if (e.key === "Escape") closeSheet(); });

  function printSheet() {
    const sheetBody = document.getElementById("sheetBody");
    const countryEl = document.getElementById("modalCountry");
    let country = countryEl ? countryEl.textContent.trim() : "";
    country = country.replace(/^[A-Z]{2}\s+/, "").trim();
    const sheetContent = sheetBody.querySelector(".sheet-content");
    const clone = (sheetContent || sheetBody).cloneNode(true);
    clone.querySelectorAll("h1,h2").forEach(function(el){ el.remove(); });
    const css = "* { margin: 0; padding: 0; box-sizing: border-box; } html { width: 210mm; } body { font-family: Georgia, serif; color: #1c1c1c; font-size: 10pt; line-height: 1.6; width: 210mm; } .page { padding: 1.8cm; } .bh { border-bottom: 3px solid #c4522a; padding-bottom: 8pt; margin-bottom: 6pt; display: flex; justify-content: space-between; align-items: flex-end; } .bn { font-family: Arial Black, sans-serif; font-size: 15pt; letter-spacing: 0.1em; color: #1c1c1c; } .br { font-size: 7pt; color: #8c7b6b; text-transform: uppercase; text-align: right; line-height: 1.6; } .ct { font-family: Arial Black, sans-serif; font-size: 34pt; color: #c4522a; margin: 6pt 0 12pt 0; line-height: 1; } h3 { font-size: 8pt; font-weight: bold; color: #c4522a; margin: 10pt 0 3pt 0; text-transform: uppercase; letter-spacing: 0.15em; border-bottom: 1px solid #e8e0d4; padding-bottom: 2pt; page-break-after: avoid; } p { margin: 0 0 5pt; font-size: 10pt; orphans: 3; widows: 3; } ul { margin: 0 0 5pt; padding-left: 16pt; } li { font-size: 10pt; margin: 0 0 2pt; page-break-inside: avoid; } em { font-style: italic; color: #6b5e52; display: block; text-align: center; margin: 10pt 0; font-size: 10pt; } strong { font-weight: 700; } .bf { border-top: 1px solid #e8e0d4; margin-top: 12pt; padding-top: 5pt; display: flex; justify-content: space-between; font-size: 7pt; color: #8c7b6b; text-transform: uppercase; } @page { margin: 0; size: A4 portrait; } @media print { .page { padding: 1.8cm; } }";
    const markup = "<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>" + country + " Travel Sheet</title><style>" + css + "</style></head><body><div class=\"page\"><div class=\"bh\"><div class=\"bn\">STOP.LOOK.AROUND</div><div class=\"br\">stoplookaround.com<br>Its Your Duty Free</div></div><div class=\"ct\">" + country + "</div>" + clone.innerHTML + "<div class=\"bf\"><span>StopLookAround.com &mdash; No Faces. Just Places.</span><span>Free. Always.</span></div></div></body></html>";
    const win = window.open("", "_blank", "width=794,height=1123");
    win.document.open();
    win.document.write(markup);
    win.document.close();
    win.focus();
    setTimeout(function() { win.print(); }, 1500);
  }

  function signupDuty() {
    const email = document.getElementById("dutyEmail").value.trim();
    if (!email || !email.includes("@")) { document.getElementById("dutyEmail").style.borderColor = "var(--rust)"; return; }
    document.querySelector(".email-capture button").textContent = "You are In";
    document.getElementById("dutyEmail").disabled = true;
  }

  function filterGear(btn, cat) {
    document.querySelectorAll(".gear-cat").forEach(function(b) { b.classList.remove("active"); });
    btn.classList.add("active");
    document.querySelectorAll(".gear-card").forEach(function(card) {
      card.style.display = (cat === "all" || card.dataset.cat === cat) ? "block" : "none";
    });
  }
</script>
</body>
</html>
